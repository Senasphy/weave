services:
  # ============================================================
  # 1. Weave Go Backend (API Server + Worker Engine)
  # ============================================================
  - type: web
    name: weave-backend
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.backend
    dockerCommand: weave all
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false # Set to your Neon DB connection string: postgresql://user:pass@ep-xyz.neon.tech/neondb?sslmode=require
      - key: WEAVE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false # Comma-separated list of your frontend URLs (e.g. https://your-app.vercel.app,https://weave-web.onrender.com)
      # Optional: set default API keys if you want shared keys
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # ============================================================
  # 2. Weave Next.js Web App (Visual Canvas & Dashboard)
  # ============================================================
  - type: web
    name: weave-web
    runtime: node
    rootDir: web
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: weave-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: weave-backend
          property: host
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
