version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: weave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: weave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weave"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: weave-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:password@postgres:5432/weave?sslmode=disable"
      PORT: "8080"
    ports:
      - "8080:8080"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: weave-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080/v1"
    ports:
      - "3000:3000"

volumes:
  pgdata:
